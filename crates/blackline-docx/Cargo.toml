[package]
name = "blackline-docx"
description = "Read, search, edit, redline, track, comment, create, and validate DOCX documents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/blackline-docx"
readme = "README.md"
# tests/corpus.rs drives the Apache POI corpus under the workspace's
# tests/corpus/, which is deliberately not published. Ship the crate
# without it so `cargo test` on the published package does not fail
# looking for data that was never in the tarball.
exclude = ["tests/corpus.rs", "tests/advanced.rs", "tests/track.rs"]
keywords = ["docx", "ooxml", "word", "office"]
categories = ["encoding", "text-processing"]

[dependencies]
blackline-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
