[package]
name = "blackline-pptx"
description = "Read, create, and edit PPTX presentations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/blackline-pptx"
readme = "README.md"
# tests/corpus.rs drives the Apache POI corpus under the workspace's
# tests/corpus/, which is deliberately not published. Ship the crate
# without it so `cargo test` on the published package does not fail
# looking for data that was never in the tarball.
exclude = ["tests/corpus.rs"]
keywords = ["pptx", "ooxml", "powerpoint", "office"]
categories = ["encoding"]

[dependencies]
blackline-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
