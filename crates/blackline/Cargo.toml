[package]
name = "blackline"
description = "Agent-first CLI for DOCX / XLSX / PPTX"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/blackline"
readme = "README.md"
keywords = ["cli", "docx", "xlsx", "pptx", "ooxml"]
categories = ["command-line-utilities", "encoding"]
default-run = "blackline"

[lib]
name = "blackline"
path = "src/lib.rs"

[[bin]]
name = "blackline"
path = "src/bin/blackline.rs"

[[bin]]
name = "bl"
path = "src/bin/bl.rs"

[features]
# Kalosm is opt-in so `cargo install blackline` stays lean. `bl llm` always
# exists; without these features it prints the rebuild line and exits 2.
#   cargo install blackline --features kalosm
#   cargo install blackline --features kalosm,metal   # Apple Silicon
#   cargo install blackline --features kalosm,cuda    # NVIDIA
default = []
kalosm = ["blackline-llm/kalosm"]
metal = ["blackline-llm/metal"]
cuda = ["blackline-llm/cuda"]

[dependencies]
blackline-core = { workspace = true }
blackline-docx = { workspace = true }
blackline-xlsx = { workspace = true }
blackline-pptx = { workspace = true }
blackline-llm = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
