[package]
name = "blackline"
description = "Agent-first CLI for DOCX / XLSX / PPTX"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/blackline"
readme = "README.md"
keywords = ["cli", "docx", "xlsx", "pptx", "ooxml"]
categories = ["command-line-utilities", "encoding"]
default-run = "blackline"

[lib]
name = "blackline"
path = "src/lib.rs"

[[bin]]
name = "blackline"
path = "src/bin/blackline.rs"

[[bin]]
name = "bl"
path = "src/bin/bl.rs"

[features]
# Kalosm is opt-in so `cargo install blackline` stays lean. `bl ai` always
# exists; without these features it prints the rebuild line and exits 2.
#   cargo install blackline --features kalosm
#   cargo install blackline --features kalosm,metal   # Apple Silicon
#   cargo install blackline --features kalosm,cuda    # NVIDIA
default = []
# kalosm-sample is a direct dep because the Parse/Schema derive macros
# expand to `kalosm_sample::…` in this crate. A transitive dep is not enough.
kalosm = ["dep:kalosm", "dep:kalosm-common", "dep:kalosm-sample", "dep:llm-samplers"]
# Apple Silicon: llama.cpp Metal (all layers on the GPU). Kalosm is only
# used to download the GGUF. Candle Metal is intentionally not enabled —
# it yields NaN logits (`No token sampled`) even for TinyLlama 2k.
metal = ["kalosm", "dep:llama-cpp-2", "dep:llama-cpp-sys-2"]
cuda = ["kalosm", "kalosm/cuda"]

[dependencies]
blackline-core = { workspace = true }
blackline-docx = { workspace = true }
blackline-xlsx = { workspace = true }
blackline-pptx = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
kalosm = { version = "0.4", default-features = false, features = ["language", "llama"], optional = true }
kalosm-common = { version = "0.4", optional = true }
kalosm-sample = { version = "0.4", optional = true }
llm-samplers = { version = "=0.0.7", optional = true }
# Optional on every target so `cargo deny --all-features` can license-check
# it. llama.cpp's Metal backend is added only on macOS.
# Pin the wrapper and the sys crate to the *same* version. `cargo install
# --git` ignores Cargo.lock; 0.1.130 + a newer sys crate fails to compile
# (`llama_set_adapter_lora` / `use_mmap` were renamed upstream).
llama-cpp-2 = { version = "=0.1.154", optional = true, default-features = false }
llama-cpp-sys-2 = { version = "=0.1.155", optional = true, default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "=0.1.154", optional = true, default-features = false, features = ["metal"] }
llama-cpp-sys-2 = { version = "=0.1.154", optional = true, default-features = false, features = ["metal"] }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
