[package]
name = "blackline-cli"
description = "Agent-first CLI for DOCX / XLSX / PPTX"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/blackline-cli"
readme = "README.md"
keywords = ["cli", "docx", "xlsx", "pptx", "ooxml"]
categories = ["command-line-utilities", "encoding"]
default-run = "blackline"

[lib]
name = "blackline_cli"
path = "src/lib.rs"

[[bin]]
name = "blackline"
path = "src/bin/blackline.rs"

[[bin]]
name = "bl"
path = "src/bin/bl.rs"

[dependencies]
blackline-core = { workspace = true }
blackline-docx = { workspace = true }
blackline-xlsx = { workspace = true }
blackline-pptx = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }
