name: Feature request
description: A new op, CLI verb, or library capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Suggested CLI verb, JSON op, or Rust API. Keep it unopinionated.
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Features that belong in an application (legal conventions, PDF
        assembly, domain-specific audits) should stay out of this
        library. Prefer a `TreeOp` or a small format-specific op.
