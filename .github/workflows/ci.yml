name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  test:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

      - name: rustdoc
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --workspace --no-deps

  # Default CI never enables `--features kalosm` (Candle / Metal / CUDA
  # do not belong on Ubuntu). Still typecheck the CPU feature so a
  # missing `kalosm-sample` (or similar) cannot ship again.
  kalosm:
    name: kalosm feature (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Native headers (Kalosm / hf-hub / esaxx-rs)
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev g++

      - name: cargo check --features kalosm
        env:
          # Ubuntu's default `c++` can be clang++, which fails esaxx-rs
          # (`<cstdint>` not found). Force GCC.
          CXX: g++
          CC: gcc
        run: cargo check -p blackline --features kalosm --locked --all-targets

  msrv:
    name: MSRV 1.88
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.88"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: test
        run: cargo test --workspace --locked

  lint:
    name: deny · typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # Versions move only through the Release workflow. A bump inside a
      # normal pull request means two releases would claim the same number,
      # or a half-bumped tree lands on main.
      # `release/*` is exempt: those pull requests are created by the Prepare
      # release workflow and changing the version is the entire point of them.
      # Without the exemption the release flow blocks itself.
      - name: Version must not change in a pull request
        if: |
          github.event_name == 'pull_request' &&
          !startsWith(github.head_ref, 'release/')
        run: |
          base="origin/${{ github.base_ref }}"
          before=$(git show "$base:Cargo.toml" | sed -n 's/^version = "\(.*\)"$/\1/p' | head -1)
          after=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "$before" != "$after" ]; then
            echo "::error::workspace version changed ($before -> $after). Versions are bumped only by the Release workflow; see docs/releasing.md."
            exit 1
          fi
          echo "version unchanged at $after"

      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories licenses bans sources

      - name: typos
        uses: crate-ci/typos@8a48f81b6c64dcfea44b3633223084c4be58ac5f # v1

  semver:
    name: semver-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2
        with:
          tool: cargo-semver-checks

      # Compares the public API against the newest version on crates.io and
      # fails when a change breaks SemVer without the version saying so.
      # Now that people can depend on these crates, catching that here beats
      # discovering it after a publish that cannot be taken back.
      - name: cargo semver-checks
        # Default heuristic enables every feature except `unstable`/`nightly`.
        # `kalosm` / `metal` / `cuda` on `blackline` do not compile on Ubuntu
        # and are not part of the published API. Check default features only.
        run: cargo semver-checks --workspace --default-features
