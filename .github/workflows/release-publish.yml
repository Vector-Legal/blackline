name: Publish release

# Step 2 of 2. Fires when a version bump lands on `main` -- i.e. when the
# pull request opened by `release-prepare.yml` is merged. Tags, publishes
# all six crates, and cuts the GitHub Release.
#
# Detection is by comparing the workspace version against the previous
# commit rather than by parsing the commit message, so a hand-edited bump
# works the same as a generated one. Every other push to main is a no-op.
#
# Nothing here pushes to `main`, only a tag -- so no ruleset bypass is
# needed. Publishing is gated on the `crates-io` environment, which pauses
# for approval.

on:
  push:
    branches: [main]
  # Recovery path. If a publish fails after the version has already landed on
  # main, the push trigger will never fire again -- the version does not change
  # a second time. Dispatching this publishes whatever version main is on,
  # provided it is not already tagged.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  detect:
    name: did the version change?
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2

      - id: check
        run: |
          version() { sed -n 's/^version = "\(.*\)"$/\1/p' "$1" | head -1; }
          now=$(version Cargo.toml)
          # Dispatched: release whatever is on main unless it is already out.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if git rev-parse -q --verify "refs/tags/v$now" >/dev/null; then
              echo "release=false" >> "$GITHUB_OUTPUT"
              echo "::error::v$now is already tagged — nothing to recover"
              exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version=$now" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git rev-parse -q --verify HEAD~1 >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git show HEAD~1:Cargo.toml > /tmp/prev.toml 2>/dev/null || : > /tmp/prev.toml
          before=$(version /tmp/prev.toml)
          echo "before=$before now=$now"
          if [ "$before" = "$now" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "no version change — nothing to release" >> "$GITHUB_STEP_SUMMARY"
          elif git rev-parse -q --verify "refs/tags/v$now" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::warning::v$now is already tagged; skipping"
          else
            echo "release=true"  >> "$GITHUB_OUTPUT"
            echo "version=$now"  >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: tag, publish, release
    needs: detect
    if: needs.detect.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: write   # tag + GitHub Release
      id-token: write   # OIDC exchange for the crates.io token
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      # The release PR's CI already ran, but re-verify: publishing cannot
      # be undone, only yanked.
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - name: rustdoc
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --workspace --no-deps

      # Only blackline-core can be packaged ahead of time. The others depend
      # on `blackline-core = "^<this version>"`, which does not exist on the
      # registry until it is published -- so packaging them here can never
      # succeed. The publish loop below packages each one at the point where
      # its dependency is actually live.
      - name: Package blackline-core before anything is permanent
        run: cargo package -p blackline-core --no-verify

      - name: Tag
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "v$VERSION"

      - name: Authenticate to crates.io via OIDC
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish, bottom-up
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          # Order matters: each crate resolves the previous one from the
          # registry. `cargo publish` waits for the index, so no sleeps.
          # Not atomic -- a failure part-way leaves earlier crates live.
          for p in blackline-core blackline-docx blackline-xlsx \
                   blackline-pptx blackline-llm blackline; do
            echo "::group::publish $p"
            cargo publish -p "$p"
            echo "::endgroup::"
          done

      - name: GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ needs.detect.outputs.version }}
          generate_release_notes: true
          body: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/v${{ needs.detect.outputs.version }}/CHANGELOG.md) for the full notes.
