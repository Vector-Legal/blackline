name: Dependabot auto-merge

# Patch and minor bumps merge themselves once the required checks pass.
# Major bumps are left alone: they are the ones that actually break things
# (`actions/checkout` v4 -> v7 dropping Node 20, say) and deserve a human.
#
# `--auto` queues the merge rather than forcing it, so the branch ruleset
# still gates it -- all three required checks must be green first. Nothing
# here bypasses branch protection.

on: pull_request

permissions:
  contents: read

jobs:
  auto-merge:
    name: queue patch and minor bumps
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # required by `gh pr merge --auto`
      pull-requests: write
    steps:
      - name: Read the update metadata
        id: meta
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2

      - name: Queue auto-merge for patch and minor
        if: |
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR"

      - name: Leave majors for a human
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr comment "$PR" --body \
            "Major version bump — not auto-merged. Check the upstream changelog for breaking changes before merging."
