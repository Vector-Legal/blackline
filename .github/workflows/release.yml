name: Release

# Releases are cut on purpose, never on a push. Day-to-day work lands on
# `main` with an entry under `## [Unreleased]` and no version change; this
# workflow turns whatever has accumulated there into a version.
#
#   Actions -> Release -> Run workflow -> pick a bump level.
#
# cargo-release does the bump, changelog rewrite, commit, tag, push and the
# dependency-ordered publish. See release.toml and docs/releasing.md.
#
# Publishing five crates is not atomic: an upload cannot be undone, only
# yanked. Verification runs first, and `dry-run` exercises the whole path
# without pushing or publishing.

on:
  workflow_dispatch:
    inputs:
      level:
        description: Version bump
        type: choice
        required: true
        default: patch
        options: [patch, minor, major]
      version:
        description: Explicit version, overriding the bump level (e.g. 1.0.0)
        type: string
        required: false
      dry-run:
        description: Verify everything, but do not push, tag, or publish
        type: boolean
        required: true
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: write   # bump commit, tag, GitHub Release
      id-token: write   # OIDC exchange for the crates.io token
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # cargo-release needs history and tags

      - name: Releases are cut from main
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::got ${{ github.ref }}"
            exit 1
          fi

      - name: Refuse to release an empty changelog
        run: |
          # cargo-release will happily roll an empty [Unreleased] into a
          # version. Everything below it is the previous release, so match
          # only up to the next heading.
          body=$(awk '/^## \[Unreleased\]/{f=1;next} /^## \[/{f=0} f' CHANGELOG.md \
                 | tr -d '[:space:]')
          if [ -z "$body" ]; then
            echo "::error::[Unreleased] is empty — nothing to release."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2
        with:
          tool: cargo-release

      # Verify before anything becomes permanent.
      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace --locked

      - name: rustdoc
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --workspace --no-deps

      - name: Resolve the bump argument
        id: bump
        run: |
          arg="${{ inputs.version }}"
          [ -z "$arg" ] && arg="${{ inputs.level }}"
          echo "arg=$arg" >> "$GITHUB_OUTPUT"

      - name: Authenticate to crates.io via OIDC
        if: ${{ !inputs.dry-run }}
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Configure the committer
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Without --execute, cargo-release reports what it would do and exits.
      - name: cargo release (dry run)
        if: ${{ inputs.dry-run }}
        run: cargo release "${{ steps.bump.outputs.arg }}" --workspace --no-confirm

      - name: cargo release
        if: ${{ !inputs.dry-run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          cargo release "${{ steps.bump.outputs.arg }}" \
            --workspace --no-confirm --execute

      - name: Read the released version back from Cargo.toml
        if: ${{ !inputs.dry-run }}
        id: released
        run: |
          v=$(cargo metadata --format-version 1 --no-deps \
              | jq -r '.packages[] | select(.name=="blackline-core") | .version')
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: GitHub Release
        if: ${{ !inputs.dry-run }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ steps.released.outputs.version }}
          generate_release_notes: true
          body: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/v${{ steps.released.outputs.version }}/CHANGELOG.md) for the full notes.
