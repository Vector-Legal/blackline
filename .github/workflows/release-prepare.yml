name: Prepare release

# Step 1 of 2. Opens a pull request that bumps the version and rolls
# `## [Unreleased]` into it. Nothing is tagged or published here.
#
#   Actions -> Prepare release -> Run workflow -> pick a bump level.
#
# Merging the resulting PR triggers `release-publish.yml`, which tags and
# publishes. Splitting it this way means no workflow ever needs to push to
# `main` directly, so branch protection stays intact and the version bump
# gets a reviewable diff before anything becomes permanent.

on:
  workflow_dispatch:
    inputs:
      level:
        description: Version bump
        type: choice
        required: true
        default: patch
        options: [patch, minor, major]
      version:
        description: Explicit version, overriding the bump level (e.g. 1.0.0)
        type: string
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: open the release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the release branch
      pull-requests: write   # open the PR
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Releases are prepared from main
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::got ${{ github.ref }}"
            exit 1
          fi

      - name: Refuse to release an empty changelog
        run: |
          body=$(awk '/^## \[Unreleased\]/{f=1;next} /^## \[/{f=0} f' CHANGELOG.md \
                 | tr -d '[:space:]')
          if [ -z "$body" ]; then
            echo "::error::[Unreleased] is empty — nothing to release."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - uses: taiki-e/install-action@6cd13508893c0e7eab5f273c2575d3859bd7229a # v2
        with:
          tool: cargo-release

      - name: Bump the version and roll the changelog
        id: bump
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          arg="${{ inputs.version }}"
          [ -z "$arg" ] && arg="${{ inputs.level }}"
          # Bump, rewrite the changelog and commit -- but do not tag, push,
          # or publish. release-publish.yml does those once this is merged.
          cargo release "$arg" --workspace --no-confirm --execute \
            --no-publish --no-push --no-tag
          v=$(cargo metadata --format-version 1 --no-deps \
              | jq -r '.packages[] | select(.name=="blackline-core") | .version')
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Reject a version that is already tagged
        run: |
          tag="v${{ steps.bump.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag already exists"
            exit 1
          fi

      - name: Push the branch and open the PR
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          branch="release/$VERSION"
          git push origin "HEAD:refs/heads/$branch" --force-with-lease
          gh pr create \
            --base main --head "$branch" \
            --title "Release $VERSION" \
            --body "$(printf '%s\n' \
              "Prepared by the \`Prepare release\` workflow." \
              "" \
              "Merging this tags \`v$VERSION\`, publishes all five crates to" \
              "crates.io, and cuts the GitHub Release. Publishing pauses for" \
              "approval on the \`crates-io\` environment." \
              "" \
              "Review the changelog section and the version bump below.")"
