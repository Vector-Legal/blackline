[workspace]
resolver = "2"
members = [
    "crates/blackline-core",
    "crates/blackline-docx",
    "crates/blackline-xlsx",
    "crates/blackline-pptx",
    "crates/blackline-cli",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
authors = ["Vector Legal Systems, PBC"]
repository = "https://github.com/Vector-Legal/blackline"
homepage = "https://github.com/Vector-Legal/blackline"
# Update repository + homepage (and the README badges) if this repo moves.
# Per-crate `documentation` URLs live on each member Cargo.toml (docs.rs).

[workspace.lints.rust]
# No `unsafe` anywhere in the tree today; keep it that way.
unsafe_code = "forbid"
missing_docs = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
# `clippy::all` is already enforced via CI's `-D warnings`. The list below
# is a curated set that the tree passes cleanly today, so it guards against
# regressions rather than parking a backlog of warnings.
#
# `clippy::pedantic` is deliberately NOT enabled: it reports ~930 findings
# here, mostly `missing_errors_doc` and `must_use_candidate`. Adopt those
# deliberately if you want them, rather than as an undifferentiated wall.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
mem_forget = "warn"
verbose_file_reads = "warn"
inefficient_to_string = "warn"
cloned_instead_of_copied = "warn"
explicit_iter_loop = "warn"
implicit_clone = "warn"
manual_assert = "warn"
uninlined_format_args = "warn"
semicolon_if_nothing_returned = "warn"
needless_continue = "warn"
checked_conversions = "warn"
from_iter_instead_of_collect = "warn"
unnested_or_patterns = "warn"
flat_map_option = "warn"
maybe_infinite_iter = "warn"

[workspace.dependencies]
# Keep these versions in lockstep with workspace.package.version so
# `cargo publish` can resolve crates.io dependencies after a transfer.
blackline-core = { path = "crates/blackline-core", version = "0.3.0" }
blackline-docx = { path = "crates/blackline-docx", version = "0.3.0" }
blackline-xlsx = { path = "crates/blackline-xlsx", version = "0.3.0" }
blackline-pptx = { path = "crates/blackline-pptx", version = "0.3.0" }

clap = { version = "4", features = ["derive"] }
quick-xml = "0.41"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
zip = "8"

assert_cmd = "2"
predicates = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
